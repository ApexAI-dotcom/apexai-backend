# Sécurité de l'espace Team : les politiques RLS rejouées sur un vrai Postgres.
# Un coach ne doit voir que ses pilotes actifs, depuis leur arrivée.
name: Sécurité Team (RLS)
on:
  pull_request:
    paths:
      - "apexai-backend/supabase/migrations/**"
      - "apexai-backend/tests/rls/**"
  push:
    branches: [master]
    paths:
      - "apexai-backend/supabase/migrations/**"
      - "apexai-backend/tests/rls/**"
  workflow_dispatch:
jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest psycopg2-binary
      - name: Tests RLS
        working-directory: apexai-backend
        env:
          APEX_RLS_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests/rls -q -p no:cacheprovider
